name: "Solana buffer deploy"
description: "Github action to deploy a program buffer on Solana"
author: "Cardinal Labs"
branding:
  icon: "upload"
  color: "red"
inputs:
  network:
    description: "The Solana network"
    required: true
    default: "devnet"
  program:
    description: "The program to build and upload"
    required: true
  program-id:
    description: "The program id of the program we are uploading"
    required: true
  buffer-authority:
    description: "The buffer authority to set"
    required: true
  keypair:
    description: "The keypair to use for deploys"
    required: true
outputs:
  buffer:
    description: "The buffer address"
    value: ${{ steps.buffer-deploy.outputs.buffer }}
  idl-buffer:
    description: "The idl buffer address."
    value: ${{ steps.buffer-deploy.outputs.idl-buffer }}
runs:
  using: "composite"
  steps:
    - run: anchor build --verifiable -p "$PROGRAM"
      shell: bash
      env:
        PROGRAM: ${{ inputs.program }}
    - run: solana-keygen new --force -o "$BUFFER_KEYPAIR_PATH" --no-bip39-passphrase
      shell: bash
      env:
        BUFFER_KEYPAIR_PATH: ${{ runner.temp }}/buffer-keypair.json
    - run: printf '%s' "$KEYPAIR" > "$KEYPAIR_PATH" && chmod 600 "$KEYPAIR_PATH"
      shell: bash
      env:
        KEYPAIR: ${{ inputs.keypair }}
        KEYPAIR_PATH: ${{ runner.temp }}/deploy-keypair.json

    - name: Buffer Deploy
      # nick-fields/retry v3.0.2
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
      with:
        timeout_minutes: 30
        max_attempts: 10
        shell: bash
        command: solana program write-buffer --buffer "$BUFFER_KEYPAIR_PATH" -k "$KEYPAIR_PATH" "./target/verifiable/${PROGRAM}.so" -u "$NETWORK" > ./buffer.out
      env:
        NETWORK: ${{ inputs.network }}
        PROGRAM: ${{ inputs.program }}
        BUFFER_KEYPAIR_PATH: ${{ runner.temp }}/buffer-keypair.json
        KEYPAIR_PATH: ${{ runner.temp }}/deploy-keypair.json

    - name: IDL Buffer Deploy
      # nick-fields/retry v3.0.2
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
      with:
        timeout_minutes: 10
        max_attempts: 10
        shell: bash
        command: anchor idl write-buffer "$PROGRAM_ID" --filepath "./target/idl/${PROGRAM}.json" --provider.cluster "$NETWORK" --provider.wallet "$KEYPAIR_PATH" > idl-buffer.out
      env:
        PROGRAM_ID: ${{ inputs.program-id }}
        PROGRAM: ${{ inputs.program }}
        NETWORK: ${{ inputs.network }}
        KEYPAIR_PATH: ${{ runner.temp }}/deploy-keypair.json

    - name: Set buffer output
      id: buffer-deploy
      shell: bash
      run: |
        buffer="$(sed -n 's/^Buffer: //p' buffer.out | tail -n 1 | tr -d '\r\n')"
        idl_buffer="$(sed -n 's/^Idl buffer created: //p' idl-buffer.out | tail -n 1 | tr -d '\r\n')"

        if [ -z "$buffer" ]; then
          echo "Failed to read the buffer address from buffer.out" >&2
          exit 1
        fi

        echo "buffer=$buffer" >> "$GITHUB_OUTPUT"
        echo "idl-buffer=$idl_buffer" >> "$GITHUB_OUTPUT"
    - run: echo "buffer=${{ steps.buffer-deploy.outputs.buffer }}"
      shell: bash
    - run: echo "idl-buffer=${{ steps.buffer-deploy.outputs.idl-buffer }}"
      shell: bash

    - name: Transfer idl buffer to authority
      # nick-fields/retry v3.0.2
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
      with:
        timeout_minutes: 10
        max_attempts: 10
        shell: bash
        command: anchor idl set-authority "$IDL_BUFFER" --provider.cluster "$NETWORK" --program-id "$PROGRAM_ID" --new-authority "$AUTHORITY" --provider.wallet "$KEYPAIR_PATH"
      env:
        IDL_BUFFER: ${{ steps.buffer-deploy.outputs.idl-buffer }}
        AUTHORITY: ${{ inputs.buffer-authority }}
        NETWORK: ${{ inputs.network }}
        PROGRAM_ID: ${{ inputs.program-id }}
        KEYPAIR_PATH: ${{ runner.temp }}/deploy-keypair.json

    - name: Transfer buffer to authority
      # nick-fields/retry v3.0.2
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
      with:
        timeout_minutes: 10
        max_attempts: 10
        shell: bash
        command: solana program set-buffer-authority "$BUFFER" -k "$KEYPAIR_PATH" --new-buffer-authority "$AUTHORITY" -u "$NETWORK"
      env:
        BUFFER: ${{ steps.buffer-deploy.outputs.buffer }}
        AUTHORITY: ${{ inputs.buffer-authority }}
        NETWORK: ${{ inputs.network }}
        KEYPAIR_PATH: ${{ runner.temp }}/deploy-keypair.json

    - name: Clean up keypairs and temporary output
      if: always()
      shell: bash
      run: |
        rm -f "$KEYPAIR_PATH" "$BUFFER_KEYPAIR_PATH" ./buffer.out ./idl-buffer.out
      env:
        KEYPAIR_PATH: ${{ runner.temp }}/deploy-keypair.json
        BUFFER_KEYPAIR_PATH: ${{ runner.temp }}/buffer-keypair.json
